
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Love Adventure ❤️</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{
 margin:0;background:#160d29;color:#fff;
 font-family:Arial,"Noto Sans Bengali",sans-serif;
 text-align:center
}
#app{width:min(100%,850px);margin:auto;padding:14px}
h1{color:#ff8fc7;line-height:1.45}
p{line-height:1.8}
button{
 border:0;border-radius:14px;padding:13px 22px;
 margin:7px;background:#ff438f;color:#fff;
 font-size:17px;font-weight:bold;cursor:pointer;
 box-shadow:0 5px 0 #a52662
}
button:active{transform:translateY(3px);box-shadow:none}
.panel{padding:14px 6px}
#homePhoto{
 width:100%;max-width:440px;max-height:390px;
 object-fit:contain;border-radius:20px;
 border:3px solid #ff8fc7;box-shadow:0 0 25px #ff438f55
}
#game,#result{display:none}
#stage{border:3px solid #ff8fc7;border-radius:15px;overflow:hidden}
canvas{display:block;width:100%;height:auto;touch-action:manipulation}
.small{font-size:14px;color:#f8cfe5}
#resultPhoto{
 display:none;width:min(88%,400px);max-height:430px;
 object-fit:contain;border-radius:20px;
 border:3px solid #ff8fc7;margin:15px auto;
 box-shadow:0 0 25px #ff438f55
}
.heart{font-size:48px;animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.13)}}
#notes p{margin:7px 0;color:#ffd0e8}
</style>
</head>
<body>
<div id="app">

<section id="home" class="panel">
 <div class="heart">❤️</div>
 <h1>LOVE ADVENTURE</h1>
 <img id="homePhoto" src="download.jpeg" alt="আমার ভালোবাসা">
 <h1 style="font-size:clamp(28px,7vw,45px)">
  চারটি লেভেল কমপ্লিট করে নিজের গার্লফ্রেন্ডকে বাঁচাও ❤️
 </h1>
 <p>বাধা পেরিয়ে পৌঁছে যাও তোমার ভালোবাসার মানুষের কাছে।</p>
 <button onclick="startGame()">▶ START GAME</button>
 <p class="small">৪টি লেভেল • ৭০টি বাধা • অসীম ভালোবাসা 💖</p>
</section>

<section id="game" class="panel">
 <h2 id="levelName">LEVEL 1</h2>
 <p id="score">বাধা: 0 / 10</p>
 <div id="stage">
  <canvas id="canvas" width="800" height="400"></canvas>
 </div>
 <p class="small">স্ক্রিনে ট্যাপ করে অথবা লাফের বোতাম চেপে বাধা পার হও।</p>
 <button onclick="jump()">⬆ লাফ দাও</button>
 <button onclick="pauseGame()" id="pauseBtn">⏸ বিরতি</button>
</section>

<section id="result" class="panel">
 <div class="heart" id="resultHeart">💖</div>
 <h1 id="resultTitle"></h1>
 <img id="resultPhoto" alt="আমার প্রিয় মানুষ">
 <p id="resultText"></p>
 <div id="notes"></div>
 <button id="nextBtn" onclick="nextLevel()">পরের লেভেল ➜</button>
 <button onclick="startGame()">↻ আবার শুরু</button>
</section>

</div>

<script>
/*
ছবিগুলোর নাম GitHub-এর Files তালিকার সঙ্গে হুবহু মিলিয়ে দাও।
নিচে দেওয়া নামগুলো তোমার আগের স্ক্রিনশট থেকে নেওয়া সম্ভাব্য নাম।
*/
const photos=[
 "download.jpeg",
 "download (1).jpeg",
 "download (2).jpeg",
 "images.jpeg",
 "images (1).jpeg"
];

const levels=[
 {count:10,note:"জান আমাকে বাঁচাও"},
 {count:15,note:"জান তুমি পারবে"},
 {count:20,note:"জান একটু তাড়াতাড়ি আমি পারছি না"},
 {count:25,note:"জান আসো আমার কাছে"}
];

const $=id=>document.getElementById(id);
const canvas=$("canvas"),ctx=canvas.getContext("2d");

let level=0,passed=0,frame=0,spawn=0;
let playerY=270,vy=0,grounded=true;
let obstacles=[],running=false,paused=false,raf=0;
let speed=4.5;

function setPhoto(img,src){
 img.style.display="none";
 img.onerror=null;
 img.onload=()=>{img.style.display="block"};
 img.onerror=()=>{img.style.display="none"};
 img.src=src;
}

// Home photo: first image
setPhoto($("homePhoto"),photos[0]);

function startGame(){
 cancelAnimationFrame(raf);
 level=0;
 $("home").style.display="none";
 $("result").style.display="none";
 $("game").style.display="block";
 beginLevel();
}

function beginLevel(){
 cancelAnimationFrame(raf);
 passed=0;frame=0;spawn=0;
 playerY=270;vy=0;grounded=true;
 obstacles=[];
 speed=4.5+level*.45;
 running=true;paused=false;
 $("pauseBtn").textContent="⏸ বিরতি";
 $("game").style.display="block";
 $("result").style.display="none";
 $("levelName").textContent="LEVEL "+(level+1);
 updateScore();
 raf=requestAnimationFrame(loop);
}

function updateScore(){
 $("score").textContent=
 "বাধা: "+passed+" / "+levels[level].count;
}

function jump(){
 if(running&&!paused&&grounded){
  vy=-14;grounded=false;
 }
}
canvas.addEventListener("pointerdown",jump);
document.addEventListener("keydown",e=>{
 if(e.code==="Space"||e.code==="ArrowUp"){
  e.preventDefault();jump();
 }
});

function pauseGame(){
 if(!running)return;
 paused=!paused;
 $("pauseBtn").textContent=paused?"▶ চালু":"⏸ বিরতি";
 if(!paused)raf=requestAnimationFrame(loop);
}

function drawBackground(){
 const g=ctx.createLinearGradient(0,0,0,400);
 g.addColorStop(0,"#82dcff");
 g.addColorStop(1,"#f7d9ff");
 ctx.fillStyle=g;ctx.fillRect(0,0,800,400);

 // Clouds
 ctx.fillStyle="#fff";
 [[100,70],[360,95],[650,65]].forEach(([x,y])=>{
  ctx.beginPath();
  ctx.arc(x, y, 22,0,Math.PI*2);
  ctx.arc(x+25,y-8,27,0,Math.PI*2);
  ctx.arc(x+51,y,21,0,Math.PI*2);
  ctx.fill();
 });

 // Hills
 ctx.fillStyle="#91dda9";
 ctx.beginPath();ctx.moveTo(0,300);
 for(let x=0;x<=800;x+=40){
  ctx.lineTo(x,260+Math.sin(x/65)*18);
 }
 ctx.lineTo(800,400);ctx.lineTo(0,400);ctx.fill();

 // Ground
 ctx.fillStyle="#52b96d";ctx.fillRect(0,330,800,70);
 ctx.fillStyle="#328b50";ctx.fillRect(0,330,800,7);
 for(let x=0;x<800;x+=48){
  ctx.fillStyle="#b8f5a0";
  ctx.fillRect((x-frame*5%48+48)%800,355,22,4);
 }
}

function drawBoy(x,y){
 // Shadow
 ctx.fillStyle="#0002";
 ctx.beginPath();ctx.ellipse(x+26,334,25,6,0,0,Math.PI*2);ctx.fill();

 // Legs
 ctx.lineCap="round";ctx.lineWidth=9;ctx.strokeStyle="#29365e";
 ctx.beginPath();
 ctx.moveTo(x+20,y+52);ctx.lineTo(x+12,y+69);
 ctx.moveTo(x+34,y+52);ctx.lineTo(x+43,y+68);
 ctx.stroke();

 // Shoes
 ctx.lineWidth=8;ctx.strokeStyle="#ff438f";
 ctx.beginPath();
 ctx.moveTo(x+7,y+71);ctx.lineTo(x+20,y+71);
 ctx.moveTo(x+39,y+70);ctx.lineTo(x+51,y+70);
 ctx.stroke();

 // Arms
 ctx.strokeStyle="#efb18d";ctx.lineWidth=8;
 ctx.beginPath();
 ctx.moveTo(x+13,y+28);ctx.lineTo(x+3,y+42);
 ctx.moveTo(x+40,y+28);ctx.lineTo(x+51,y+40);
 ctx.stroke();

 // Shirt
 ctx.fillStyle="#6350c5";ctx.fillRect(x+12,y+22,29,34);

 // Neck and face
 ctx.fillStyle="#efb18d";ctx.fillRect(x+23,y+15,10,10);
 ctx.beginPath();ctx.arc(x+27,y+14,14,0,Math.PI*2);ctx.fill();

 // Hair
 ctx.fillStyle="#322038";
 ctx.beginPath();ctx.arc(x+27,y+11,16,Math.PI,Math.PI*2);
 ctx.lineTo(x+43,y+15);ctx.lineTo(x+12,y+15);ctx.fill();
 ctx.fillRect(x+14,y+5,8,10);
 ctx.fillRect(x+29,y+3,10,8);

 // Eyes and smile
 ctx.fillStyle="#322038";
 ctx.fillRect(x+20,y+13,4,4);ctx.fillRect(x+31,y+13,4,4);
 ctx.strokeStyle="#a44760";ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(x+22,y+21);
 ctx.quadraticCurveTo(x+27,y+25,x+33,y+21);ctx.stroke();
}

function drawObstacle(o){
 ctx.fillStyle="#784239";ctx.fillRect(o.x,o.y,o.w,o.h);
 ctx.fillStyle="#c97956";ctx.fillRect(o.x+5,o.y+5,6,o.h-7);
 ctx.fillStyle="#ef9a73";ctx.fillRect(o.x,o.y,o.w,6);
}

function loop(){
 if(!running||paused)return;
 frame++;
 drawBackground();

 vy+=.65;playerY+=vy;
 if(playerY>=270){playerY=270;vy=0;grounded=true}
 drawBoy(100,playerY);

 spawn++;
 const gap=Math.max(75,108-level*5);
 if(spawn>=gap){
  spawn=0;
  obstacles.push({x:820,y:288,w:28,h:42,done:false});
 }

 for(const o of obstacles){
  o.x-=speed;
  drawObstacle(o);

  // Collision check
  if(o.x<143&&o.x+o.w>100&&playerY+72>o.y+4){
   if(playerY>o.y-65){finish(false);return}
  }

  if(!o.done&&o.x+o.w<100){
   o.done=true;passed++;updateScore();
   if(passed>=levels[level].count){finish(true);return}
  }
 }
 obstacles=obstacles.filter(o=>o.x>-60);

 ctx.fillStyle="#38234fdd";ctx.fillRect(12,12,195,38);
 ctx.fillStyle="#fff";ctx.font="bold 18px Arial";
 ctx.fillText("❤️ LOVE RUN",24,37);
 raf=requestAnimationFrame(loop);
}

function finish(won){
 running=false;paused=false;cancelAnimationFrame(raf);
 $("game").style.display="none";
 $("result").style.display="block";
 $("notes").innerHTML="";
 $("resultPhoto").style.display="none";

 if(!won){
  $("resultHeart").textContent="💪";
  $("resultTitle").textContent="আবার চেষ্টা করো!";
  $("resultText").textContent="বাধায় ধাক্কা লেগেছে। তুমি আবার চেষ্টা করতে পারবে!";
  $("nextBtn").textContent="আবার চেষ্টা করো";
  return;
 }

 $("resultHeart").textContent="💖";
 $("resultTitle").textContent="LEVEL "+(level+1)+" COMPLETED!";
 $("resultText").textContent=levels[level].note;

 // One unique picture after each level.
 // Level 1 -> photos[1], Level 2 -> photos[2], etc.
 setPhoto($("resultPhoto"),photos[level+1]);

 if(level===3){
  $("resultTitle").textContent="তুমি তোমার ভালোবাসাকে বাঁচিয়েছো! ❤️";
  $("resultText").textContent="চারটি লেভেল শেষ! তোমাদের ভালোবাসার জয় হয়েছে।";
  $("notes").innerHTML=
   "<p>জান, সব বাধা পেরিয়ে তোমার কাছে এলাম। ❤️</p>"+
   "<p>তোমার হাসি আমার সবচেয়ে বড় সুখ। 💕</p>"+
   "<p>তুমি পাশে থাকলে সব বাধা পার হব। 🌹</p>"+
   "<p>আমার গল্পের সবচেয়ে সুন্দর মানুষটা তুমি। 💗</p>";
  $("nextBtn").textContent="💖 আবার শুরু";
 }else{
  $("nextBtn").textContent="পরের লেভেল ➜";
 }
}

function nextLevel(){
 if(level>=3){startGame();return}
 if(passed>=levels[level].count){
  level++;beginLevel();
 }else{
  // Failed run: retry the same level.
  beginLevel();
 }
}
</script>
</body>
 </html>
